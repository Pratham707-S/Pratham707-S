<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <style>
      .font-mono {
        font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
      }
      
      /* Cursor Blink */
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: blink 0.9s infinite;
      }

      /* Pulse for Limitless */
      @keyframes pulseGlow {
        0%, 100% {
          filter: drop-shadow(0 0 4px #38bdf8);
          fill: #38bdf8;
        }
        50% {
          filter: drop-shadow(0 0 10px #ec4899);
          fill: #f472b6;
        }
      }
      .limitless-pulse {
        animation: pulseGlow 2.5s ease-in-out infinite;
        font-weight: bold;
      }

      /* Flowchart highlights */
      @keyframes stepHighlight {
        0%, 15% { opacity: 0.4; }
        20%, 35% { opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
        40%, 100% { opacity: 0.4; }
      }
      @keyframes stepHighlight2 {
        0%, 35% { opacity: 0.4; }
        40%, 55% { opacity: 1; filter: drop-shadow(0 0 8px #818cf8); }
        60%, 100% { opacity: 0.4; }
      }
      @keyframes stepHighlight3 {
        0%, 55% { opacity: 0.4; }
        60%, 75% { opacity: 1; filter: drop-shadow(0 0 8px #c084fc); }
        80%, 100% { opacity: 0.4; }
      }
      @keyframes stepHighlight4 {
        0%, 75% { opacity: 0.4; }
        80%, 98% { opacity: 1; filter: drop-shadow(0 0 12px #ec4899); }
        100% { opacity: 0.4; }
      }

      .node-start { animation: stepHighlight 8s ease-in-out infinite; }
      .node-pain { animation: stepHighlight2 8s ease-in-out infinite; }
      .node-adapt { animation: stepHighlight3 8s ease-in-out infinite; }
      .node-transcend { animation: stepHighlight4 8s ease-in-out infinite; }

      /* Scanning line */
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 0.2; }
        85% { opacity: 0.2; }
        100% { transform: translateY(440px); opacity: 0; }
      }
      .scanner {
        animation: scanline 5s linear infinite;
      }

      /* Execution Output Line Fade In Animation */
      @keyframes logPulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; filter: drop-shadow(0 0 3px #10b981); }
      }
      .log-live {
        animation: logPulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Outer Window Frame -->
  <rect x="2" y="2" width="856" height="476" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Scanning Light Line -->
  <line x1="10" y1="40" x2="850" y2="40" stroke="#38bdf8" stroke-width="1.5" class="scanner" />

  <!-- Window Header Bar -->
  <rect x="2" y="2" width="856" height="38" rx="14" fill="#111827" />
  <rect x="2" y="26" width="856" height="14" fill="#111827" />
  <line x1="2" y1="40" x2="858" y2="40" stroke="#1e293b" stroke-width="1" />

  <!-- macOS Window Dots -->
  <circle cx="24" cy="20" r="6" fill="#ff5f56" />
  <circle cx="44" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="20" r="6" fill="#27c93f" />

  <!-- Window Title -->
  <text x="430" y="24" text-anchor="middle" fill="#94a3b8" font-size="12" class="font-mono">
    pratham@system-core: ~/protocols/crown_of_thorns.py — zsh
  </text>

  <!-- ================= LEFT COLUMN: FLOWCHART CARD ================= -->
  <rect x="22" y="56" width="310" height="402" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  
  <text x="40" y="84" fill="#38bdf8" font-size="13" font-weight="bold" class="font-mono">
    ⚡ EVOLUTION PROTOCOL
  </text>
  <line x1="40" y1="94" x2="310" y2="94" stroke="#334155" stroke-width="1" />

  <!-- Node 1: START -->
  <g class="node-start">
    <rect x="115" y="112" width="120" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="175" y="130" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold" class="font-mono">START</text>
  </g>
  <line x1="175" y1="140" x2="175" y2="158" stroke="#64748b" stroke-width="1.5" />
  <polygon points="175,162 171,154 179,154" fill="#64748b" />

  <!-- Node 2: CHALLENGE / PAIN -->
  <g class="node-pain">
    <rect x="105" y="166" width="140" height="28" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="175" y="184" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold" class="font-mono">PAIN / CHALLENGE</text>
  </g>
  <line x1="175" y1="194" x2="175" y2="212" stroke="#64748b" stroke-width="1.5" />
  <polygon points="175,216 171,208 179,208" fill="#64748b" />

  <!-- Node 3: GIVE UP? NO -->
  <rect x="110" y="220" width="130" height="26" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1" />
  <text x="175" y="237" text-anchor="middle" fill="#94a3b8" font-size="10" class="font-mono">GIVE UP? ➔ NO</text>

  <line x1="175" y1="246" x2="175" y2="264" stroke="#64748b" stroke-width="1.5" />
  <polygon points="175,268 171,260 179,260" fill="#64748b" />

  <!-- Node 4: ADAPT & EVOLVE -->
  <g class="node-adapt">
    <rect x="105" y="272" width="140" height="28" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <text x="175" y="290" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold" class="font-mono">ADAPT &amp; EVOLVE</text>
  </g>
  <line x1="175" y1="300" x2="175" y2="318" stroke="#64748b" stroke-width="1.5" />
  <polygon points="175,322 171,314 179,314" fill="#64748b" />

  <!-- Node 5: LIMIT REACHED? -->
  <rect x="110" y="326" width="130" height="26" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1" />
  <text x="175" y="343" text-anchor="middle" fill="#94a3b8" font-size="10" class="font-mono">LIMIT? ➔ BREAK</text>

  <line x1="175" y1="352" x2="175" y2="370" stroke="#ec4899" stroke-width="1.5" />
  <polygon points="175,374 171,366 179,366" fill="#ec4899" />

  <!-- Node 6: TRANSCEND (FINAL) -->
  <g class="node-transcend">
    <rect x="85" y="380" width="180" height="34" rx="8" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.5" />
    <text x="175" y="402" text-anchor="middle" fill="#f472b6" font-size="12" font-weight="bold" class="font-mono">👑 TRANSCEND ⚡</text>
  </g>

  <text x="175" y="440" text-anchor="middle" fill="#64748b" font-size="10" class="font-mono">while True: evolve()</text>

  <!-- ================= RIGHT COLUMN: LIVE TERMINAL EXECUTION ================= -->
  
  <!-- Right Top: Live Terminal Shell Box -->
  <rect x="350" y="56" width="488" height="255" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  
  <!-- Terminal Prompt & Command Execution -->
  <g class="font-mono">
    <text x="370" y="82" fill="#10b981" font-size="12" font-weight="bold">❯</text>
    <text x="388" y="82" fill="#f8fafc" font-size="12">python3 crown_of_thorns.py --exec</text>
    <rect x="675" y="70" width="8" height="14" fill="#38bdf8" class="cursor" />

    <line x1="370" y1="94" x2="820" y2="94" stroke="#334155" stroke-width="0.8" />

    <!-- Real Live Terminal Execution Output -->
    <text x="370" y="116" font-size="11" fill="#64748b">
      [00:00:01] <tspan fill="#38bdf8">[INIT]</tspan> Booting CrownOfThorns protocol v2.0...
    </text>

    <text x="370" y="136" font-size="11" fill="#e2e8f0">
      [00:00:02] <tspan fill="#f59e0b">[GROW]</tspan> Calculating resistance: <tspan fill="#f43f5e">thorns.infinite()</tspan>
    </text>

    <text x="370" y="156" font-size="11" fill="#e2e8f0">
      [00:00:03] <tspan fill="#818cf8">[PAIN]</tspan> Pain absorbed ➔ Power level: <tspan fill="#f472b6" font-weight="bold">MAXIMUM</tspan>
    </text>

    <text x="370" y="176" font-size="11" fill="#e2e8f0">
      [00:00:04] <tspan fill="#10b981">[PASS]</tspan> Break the loop ➔ <tspan fill="#38bdf8">transcendence()</tspan> triggered
    </text>

    <!-- State Result Dict -->
    <rect x="368" y="188" width="452" height="42" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <text x="378" y="205" font-size="10.5" fill="#94a3b8">
      <tspan fill="#c084fc">return</tspan> { <tspan fill="#38bdf8">'mind'</tspan>: <tspan fill="#34d399">'beyond'</tspan>, <tspan fill="#38bdf8">'body'</tspan>: <tspan fill="#34d399">'limitless'</tspan>, <tspan fill="#38bdf8">'soul'</tspan>: <tspan fill="#34d399">'untouchable'</tspan> }
    </text>
    <text x="378" y="222" font-size="10.5" fill="#10b981" class="log-live">
      ✔ STATUS: 200 OK — Legend Mode Activated.
    </text>

    <text x="370" y="254" font-size="11" fill="#f472b6">
      [00:00:05] <tspan fill="#f59e0b">while True:</tspan> <tspan fill="#38bdf8">evolve()</tspan> <tspan fill="#64748b">// running indefinitely...</tspan>
    </text>

    <text x="370" y="282" font-size="11" fill="#10b981" font-weight="bold">
      ❯ <tspan fill="#94a3b8">Session persistent. Monitoring active stream...</tspan>
    </text>
  </g>

  <!-- Right Bottom: System Overview Card -->
  <rect x="350" y="323" width="488" height="135" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  
  <text x="370" y="348" fill="#a855f7" font-size="12" font-weight="bold" class="font-mono">
    ⚙️ SYSTEM_OVERVIEW // REAL-TIME TELEMETRY
  </text>
  <line x1="370" y1="358" x2="820" y2="358" stroke="#334155" stroke-width="0.8" />

  <g class="font-mono" font-size="11.5">
    <text x="370" y="380">
      <tspan fill="#94a3b8">mind:  </tspan><tspan fill="#38bdf8">transcending... [██████████] 100%</tspan>
    </text>
    <text x="370" y="400">
      <tspan fill="#94a3b8">body:  </tspan><tspan fill="#818cf8">evolving...     [██████████] 100%</tspan>
    </text>
    <text x="370" y="420">
      <tspan fill="#94a3b8">soul:  </tspan><tspan fill="#c084fc">infinite...     [██████████] ∞</tspan>
    </text>
    <text x="370" y="442">
      <tspan fill="#94a3b8">power: </tspan><tspan class="limitless-pulse">⚡ LIMITLESS</tspan>
    </text>
  </g>

</svg>
